<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in - ShowWise Backend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='console.css') }}" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth">
    <div class="brand"><span class="brand-mark">S</span><span class="brand-name">ShowWise<small>Backend</small></span></div>
    <div class="panel"><div class="panel-body">
      <h1>Sign in</h1>
      <p class="lead">Manage instances, kill switches and support access.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}<div class="flashes" role="status">
          {% for category, message in messages %}<div class="flash {{ category }}"><span>{{ message }}</span></div>{% endfor %}
        </div>{% endif %}
      {% endwith %}

      <form method="POST" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autofocus autocomplete="username" autocapitalize="off" spellcheck="false" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="min-height:42px;">Sign in</button>
      </form>
    </div></div>
  </div>
</div>
</body>
</html>
