{% extends "base.html" %}
{% block title %}Inbox - ShowWise{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i class="fas fa-paper-plane"></i> Inbox</h1>
  <p>Team and personal messages — modern view</p>
</div>

<style>
  .messaging { display:flex; gap:1rem; height:70vh; }
  .ms-sidebar { width:320px; background:#f8fafc; border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .ms-search { padding:0.75rem; border-bottom:1px solid var(--gray-200); }
  .ms-conversations { overflow:auto; flex:1; }
  .conv-item { padding:0.75rem 0.75rem; display:flex; gap:0.75rem; align-items:center; cursor:pointer; border-bottom:1px solid rgba(0,0,0,0.03); }
  .conv-item:hover { background: #ffffff; }
  .avatar { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-weight:800; }
  .conv-meta { flex:1; }
  .conv-title { font-weight:800; }
  .conv-snippet { color:var(--gray-600); font-size:0.9rem; }
  .badge { background:var(--primary); color:white; padding:4px 8px; border-radius:999px; font-weight:800; font-size:0.8rem; }

  .ms-panel { flex:1; background:linear-gradient(180deg,#fff,#fbfdff); border-radius:12px; display:flex; flex-direction:column; overflow:hidden; }
  .panel-header { padding:1rem; border-bottom:1px solid var(--gray-100); display:flex; gap:1rem; align-items:center; }
  .panel-body { flex:1; padding:1rem; overflow:auto; display:flex; flex-direction:column; gap:0.75rem; }
  .bubble { max-width:66%; padding:0.75rem 1rem; border-radius:18px; box-shadow:0 4px 12px rgba(2,6,23,0.06); }
  .bubble-left { align-self:flex-start; background:white; border-top-left-radius:6px; }
  .bubble-right { align-self:flex-end; background:linear-gradient(135deg,var(--primary),var(--accent)); color:white; }
  .msg-meta { font-size:0.8rem; color:var(--gray-600); margin-top:0.25rem; }
  .panel-input { padding:0.75rem; border-top:1px solid var(--gray-100); display:flex; gap:0.5rem; align-items:center; }
  .input { flex:1; padding:0.75rem 1rem; border-radius:999px; border:1px solid var(--gray-200); }
</style>

<div class="messaging">
  <div class="ms-sidebar card">
    <div class="ms-search">
      <input id="search" placeholder="Search or start new chat" style="width:100%; padding:0.6rem 0.75rem; border-radius:8px; border:1px solid var(--gray-200);" />
    </div>
    <div class="ms-conversations" id="conversations"></div>
  </div>

  <div class="ms-panel">
    <div class="panel-header">
      <div id="panelTitle"><strong>Select a conversation</strong></div>
    </div>
    <div class="panel-body" id="messagesPanel">
      <div style="color:var(--gray-600); text-align:center; margin-top:2rem;">No conversation selected</div>
    </div>
    <div class="panel-input">
      <input id="replyInput" class="input" placeholder="Type a reply..." />
      <button id="sendBtn" class="btn btn-primary">Send</button>
    </div>
  </div>
</div>

<script>
const username = '{{ session.get("username") }}';
let allMessages = [];
let conversations = [];
let activeConv = null;

function uid(str){ return String(str||'').replace(/\s+/g,'_').toLowerCase(); }

function loadAll(){
  fetch(`/api/chat/inbox/${username}?per_page=200`) // load a good chunk
    .then(r=>r.json()).then(res=>{
      if (!res.success) return;
      allMessages = res.messages.reverse(); // oldest first
      buildConversations();
    }).catch(console.error);
}

function buildConversations(){
  const map = new Map();
  for (const m of allMessages){
    const key = `${m.org_slug}::${m.team||''}::${m.from_name||m.from_email||'user'}`;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(m);
  }
  conversations = Array.from(map.entries()).map(([k, msgs])=>({key:k, msgs})).sort((a,b)=> b.msgs[b.msgs.length-1].id - a.msgs[a.msgs.length-1].id);
  renderConversations();
}

function renderConversations(){
  const container = document.getElementById('conversations'); container.innerHTML='';
  for (const conv of conversations){
    const last = conv.msgs[conv.msgs.length-1];
    const unread = conv.msgs.filter(m=>!(m.read_by||[]).includes(username) && m.from=='user').length;
    const parts = conv.key.split('::');
    const title = parts[2] || last.from_name || last.from_email || 'Conversation';
    const org = parts[0];

    const el = document.createElement('div'); el.className='conv-item';
    el.onclick = ()=>{ openConversation(conv); };
    const avatar = document.createElement('div'); avatar.className='avatar'; avatar.style.background = stringToColor(title);
    avatar.innerText = title.slice(0,2).toUpperCase();
    const meta = document.createElement('div'); meta.className='conv-meta';
    meta.innerHTML = `<div class='conv-title'>${escapeHtml(title)} <span style='color:var(--gray-500); font-weight:600; font-size:0.85rem;'>• ${escapeHtml(org)}</span></div><div class='conv-snippet'>${escapeHtml((last.message||'').slice(0,80))}</div>`;
    el.appendChild(avatar); el.appendChild(meta);
    if (unread) { const b=document.createElement('div'); b.className='badge'; b.innerText=unread; el.appendChild(b); }
    container.appendChild(el);
  }
}

function openConversation(conv){
  activeConv = conv; document.getElementById('panelTitle').innerHTML = `<strong>${escapeHtml(conv.msgs[0].from_name||conv.msgs[0].from_email||conv.msgs[0].org_slug)}</strong> <span style='color:var(--gray-600); font-size:0.9rem; margin-left:0.5rem;'>${escapeHtml(conv.msgs[0].org_slug)}</span>`;
  const panel = document.getElementById('messagesPanel'); panel.innerHTML = '';
  for (const m of conv.msgs){
    const b = document.createElement('div');
    b.className = 'bubble ' + (m.from === 'user' ? 'bubble-left' : 'bubble-right');
    b.innerHTML = `<div style='font-weight:700'>${escapeHtml(m.from_name||m.from_email||'User')}</div><div style='margin-top:0.25rem'>${escapeHtml(m.message)}</div><div class='msg-meta'>${m.timestamp.slice(0,19)}</div>`;
    panel.appendChild(b);
    // mark read for messages from user
    if (m.from === 'user' && !(m.read_by||[]).includes(username)){
      fetch('/api/chat/mark-read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg_id:m.id, username})}).catch(()=>{});
      m.read_by = m.read_by || []; m.read_by.push(username);
    }
  }
  panel.scrollTop = panel.scrollHeight;
  renderConversations();
}

function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function stringToColor(s){ let h=0; for(let i=0;i<s.length;i++) h = s.charCodeAt(i) + ((h<<5)-h); const color = `hsl(${h%360} 70% 40%)`; return color; }

document.getElementById('sendBtn').addEventListener('click', ()=>{
  if (!activeConv) return;
  const txt = document.getElementById('replyInput').value.trim(); if (!txt) return;
  // Send admin reply by appending to local view and hitting /chat/reply for the last message id in conv
  const lastId = activeConv.msgs[activeConv.msgs.length-1].id;
  const form = new URLSearchParams(); form.append('reply', txt);
  fetch(`/chat/reply/${lastId}`, {method:'POST', body: form}).then(()=>{
    // locally append a reply bubble
    const now = new Date().toISOString();
    const reply = { id: Date.now(), timestamp: now, org_slug: activeConv.msgs[0].org_slug, from: 'admin', from_name: username, message: txt, reply_to: lastId, read: true };
    activeConv.msgs.push(reply);
    document.getElementById('replyInput').value = '';
    openConversation(activeConv);
  }).catch(console.error);
});

loadAll();
</script>

{% endblock %}
